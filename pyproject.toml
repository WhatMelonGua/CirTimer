[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circlock"
version = "0.1.0"
description = "超能苹果钟 — 队列式工位节律闹钟"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]
license = { text = "MIT" }
keywords = ["pomodoro", "timer", "health", "desktop", "pyside6"]

[tool.setuptools]
packages = ["cirtimer", "cirtimer.ui"]

[tool.setuptools.package-data]
cirtimer = ["*.py"]
